# SPDX-License-Identifier: Apache-2.0

[package]
name = "kvio-ir"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Checked KV-cache workload translation and fio iolog validation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[package.metadata.kani.flags]
default-unwind = "12"
